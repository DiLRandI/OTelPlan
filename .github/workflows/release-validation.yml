name: Release validation

on:
  workflow_dispatch:
    inputs:
      prepare_version:
        description: 'Version to package and attest from main after validation. Leave empty for tests only.'
        type: string
        required: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: make test

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: make test-race

  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: make vet

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOLANGCI_LINT_VERSION: 2.14.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install pinned linter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          archive="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
          checksums="golangci-lint-${GOLANGCI_LINT_VERSION}-checksums.txt"
          gh release download "v${GOLANGCI_LINT_VERSION}" --repo golangci/golangci-lint --pattern "$archive" --pattern "$checksums"
          sha256sum --check --ignore-missing "$checksums"
          tar -xzf "$archive" "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint"
          echo "$RUNNER_TEMP/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64" >> "$GITHUB_PATH"
      - run: make lint GOLANGCI_LINT=golangci-lint

  otelc-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [a-m, remaining, architecture, cli-build]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Check out pinned backend
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: open-telemetry/opentelemetry-go-compile-instrumentation
          ref: 449ee08a682586adb177e4402845ed404565879f # otelc v1.1.0
          path: .ci-otelc
          persist-credentials: false
      - name: Build pinned backend
        working-directory: .ci-otelc
        run: go build -mod=readonly -trimpath -ldflags '-X go.opentelemetry.io/otelc/tool/util.Version=v1.1.0' -o "$RUNNER_TEMP/otelc" ./tool/cmd/otelc
      - name: Test real backend
        run: sh scripts/test-otelc-shard.sh "$OTELPLAN_TEST_SHARD"
        env:
          OTELPLAN_TEST_SHARD: ${{ matrix.shard }}
          OTELPLAN_OTELC: ${{ runner.temp }}/otelc

  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: make test-gates

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: make vuln GOVULNCHECK=govulncheck
      - name: Check out pinned OTelC for dependency validation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: open-telemetry/opentelemetry-go-compile-instrumentation
          ref: 449ee08a682586adb177e4402845ed404565879f # otelc v1.1.0
          path: .ci-vuln-otelc
          persist-credentials: false
      - name: Check OTelC and generated hook module dependencies
        run: sh scripts/check-pinned-release-dependencies.sh .ci-vuln-otelc

  release-validation:
    if: always()
    needs: [unit, race, vet, lint, otelc-e2e, quality-gates, vuln]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UNIT_RESULT: ${{ needs.unit.result }}
      RACE_RESULT: ${{ needs.race.result }}
      VET_RESULT: ${{ needs.vet.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      OTELC_RESULT: ${{ needs.otelc-e2e.result }}
      QUALITY_GATES_RESULT: ${{ needs.quality-gates.result }}
      VULN_RESULT: ${{ needs.vuln.result }}
    steps:
      - name: Require every release validation gate
        run: |
          for result in "$UNIT_RESULT" "$RACE_RESULT" "$VET_RESULT" "$LINT_RESULT" "$OTELC_RESULT" "$QUALITY_GATES_RESULT" "$VULN_RESULT"; do
            test "$result" = success || exit 1
          done

  prepare-linux-candidate:
    if: github.repository == 'DiLRandI/OTelPlan' && github.ref == 'refs/heads/main' && inputs.prepare_version != ''
    needs: release-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ inputs.prepare_version }}
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build twice from the validated commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          go mod download
          sh scripts/release-linux.sh "$RELEASE_VERSION" "$RUNNER_TEMP/candidate"
          sh scripts/release-linux.sh "$RELEASE_VERSION" "$RUNNER_TEMP/repeated"
          diff -qr "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/repeated"
          cd "$RUNNER_TEMP/candidate"
          sha256sum --strict -c SHA256SUMS
      - name: Validate SPDX against the official schema
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download v6.0.3 --repo santhosh-tekuri/jsonschema --pattern jv-v6.0.3-linux-amd64.tar.gz
          printf '%s  %s\n' 36e9ab8481cc8e2cb27c8336decc9abdcbd606b05792ca88d6188e01ec28766b jv-v6.0.3-linux-amd64.tar.gz | sha256sum -c -
          tar -xzf jv-v6.0.3-linux-amd64.tar.gz jv
          curl -fsSL --retry 3 https://raw.githubusercontent.com/spdx/spdx-spec/6f2cb47d13db19b12c23885573b22ef32ec1ada5/schemas/spdx-schema.json -o spdx-schema.json
          printf '%s  %s\n' 4126dc29f15e92feec92e9622f4939131ad58b125d6f578aa93e980a6e6f3212 spdx-schema.json | sha256sum -c -
          ./jv spdx-schema.json candidate/otelplan_"${RELEASE_VERSION}"_linux_amd64.spdx.json
      - name: Check out pinned backend for the archive exercise
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: open-telemetry/opentelemetry-go-compile-instrumentation
          ref: 449ee08a682586adb177e4402845ed404565879f # otelc v1.1.0
          path: .ci-otelc
          persist-credentials: false
      - name: Build exact pinned backend
        working-directory: .ci-otelc
        run: |
          go build -mod=readonly -trimpath -ldflags '-X go.opentelemetry.io/otelc/tool/util.Version=v1.1.0' -o "$RUNNER_TEMP/otelc" ./tool/cmd/otelc
          go version -m "$RUNNER_TEMP/otelc"
          sha256sum "$RUNNER_TEMP/otelc"
      - name: Exercise the extracted CLI across three architectures
        run: |
          stem="otelplan_${RELEASE_VERSION}_linux_amd64"
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf "$RUNNER_TEMP/candidate/$stem.tar.gz" -C "$RUNNER_TEMP/extracted"
          extracted="$RUNNER_TEMP/extracted/$stem"
          jq -e --arg sha "$GITHUB_SHA" --arg version "$RELEASE_VERSION" --arg go "$(go env GOVERSION)" \
            '.sourceRevision == $sha and .version == $version and .target == "linux/amd64" and .goVersion == $go' \
            "$extracted/release.json"
          python3 -I scripts/test-packaged-linux.py "$extracted/otelplan" "$RUNNER_TEMP/otelc" "$RELEASE_VERSION"
      - name: Attest candidate bytes
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/candidate/*
      - name: Verify the bundle and reject changed bytes
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          sh scripts/verify-release-provenance.sh "$RUNNER_TEMP/candidate" "$RELEASE_VERSION" "$GITHUB_SHA" "$BUNDLE"
          changed="$RUNNER_TEMP/changed.tar.gz"
          cp "$RUNNER_TEMP/candidate/otelplan_${RELEASE_VERSION}_linux_amd64.tar.gz" "$changed"
          printf 'modified\n' >> "$changed"
          if gh attestation verify "$changed" --repo "$GITHUB_REPOSITORY" --bundle "$BUNDLE"; then
            echo 'Attestation accepted a modified archive' >&2
            exit 1
          fi
          cp "$BUNDLE" "$RUNNER_TEMP/candidate/provenance.jsonl"
      - name: Store candidate for maintainer review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otelplan-linux-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
