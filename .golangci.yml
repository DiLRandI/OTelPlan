version: "2"
run:
  timeout: 5m
linters:
  default: all
  disable:
    - depguard
    - tagliatelle
    - gomodguard
    - exhaustruct
    - wsl
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2 
  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - funlen
          - goconst