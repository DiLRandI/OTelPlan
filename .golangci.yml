version: "2"
run:
  timeout: 5m
linters:
  default: all
  disable:
    - depguard
    - tagliatelle
    - gomodguard
    - exhaustruct
    - wsl
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2 
  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - funlen
          - goconst
      - path: '^internal/cli/run\.go$'
        source: '^var Version = "dev"$'
        linters:
          - gochecknoglobals
      - path: '^internal/backend/otelc/compatibility\.go$'
        source: '^\s*command := exec\.CommandContext\(ctx, path, "version"\)$'
        text: '^(?:G204: Subprocess launched with variable|G702: Command injection via taint analysis)$'
        linters:
          - gosec
      - path: '^internal/cli/compile\.go$'
        source: '^\s*command := exec\.CommandContext\(ctx, "go", args\.\.\.\)$'
        text: '^(?:G204: Subprocess launched with variable)$'
        linters:
          - gosec
      - path: '^internal/compiler/build\.go$'
        source: '^\s*command := exec\.CommandContext\(ctx, executable, args\.\.\.\)$'
        text: '^G204: Subprocess launched with variable$'
        linters:
          - gosec
      - path: '^internal/discovery/(benchmark|context|load)_test\.go$'
        source: '^package discovery$'
        linters:
          - testpackage
      - path: '^internal/compiler/(application_selection|build_directory|build_output|default_output|vendor)_test\.go$'
        source: '^package compiler$'
        linters:
          - testpackage
      - path: '^internal/backend/otelc/(attribute_hooks|compatibility|typed_accessors)_test\.go$'
        source: '^package otelc$'
        linters:
          - testpackage
      - path: '^internal/cli/(build_arguments|build_destination|build|run)_test\.go$'
        source: '^package cli$'
        linters:
          - testpackage
