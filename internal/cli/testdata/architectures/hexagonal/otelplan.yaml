apiVersion: otelplan.io/v1alpha1
kind: InstrumentationPlan
backend: {name: otelc, version: v1.1.0}
project: {packages: [./...]}
rules:
- id: checkout
  match:
    symbols: [example.com/architecture/internal/application.(Checkout).Submit]
  span: {name: checkout}
- id: payment
  match:
    implements: [example.com/architecture/internal/ports.Payment]
  span: {name: payment}
